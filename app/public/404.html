<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page introuvable | Jeu d'échecs</title>
    <meta name="author" content="ADAM Issoufi" />
    <meta name="robots" content="noindex" />
    <!-- Root-absolute URLs: Cloudflare Pages serves this page at any unknown path. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Inline styles: Vite copies this page as it is, so it cannot load the hashed stylesheet. -->
    <style>
      * {
        box-sizing: border-box;
      }

      /* The colors of the board and of the dialogs of the game. */
      :root {
        --light-square: #ffcf9e;
        --dark-square: #d18b46;
        --ink: #2b1d0e;
        --paper: #fff8ef;
        --accent: #ff9800;
        --scrim: rgba(43, 29, 14, 0.6);
        --square: 120px;
        --display-font:
          'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
      }

      /* A dimmed checkerboard in the colors of the board, behind the card. */
      body {
        margin: 0;
        padding: 1rem;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: var(--display-font);
        color: var(--ink);
        background-color: var(--light-square);
        background-image:
          linear-gradient(var(--scrim), var(--scrim)),
          conic-gradient(
            var(--dark-square) 25%,
            transparent 0 50%,
            var(--dark-square) 0 75%,
            transparent 0
          );
        background-size:
          auto,
          var(--square) var(--square);
      }

      main {
        width: 100%;
        max-width: 28rem;
        padding: 2rem 1.5rem;
        border-radius: 10px;
        background-color: var(--paper);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      .piece {
        margin: 0;
        font-size: 5rem;
        line-height: 1;
      }

      .code {
        margin: 1rem 0 0;
        font-size: 1rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0.25rem 0 0;
        font-size: 2rem;
      }

      .message {
        margin: 1rem 0 1.5rem;
        font-size: 1.2rem;
        line-height: 1.4;
      }

      a {
        display: inline-block;
        padding: 0.5rem 1.25rem;
        border-radius: 5px;
        background-color: var(--accent);
        color: var(--ink);
        font-size: 1.2rem;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      a:focus-visible {
        outline: 3px solid var(--ink);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="piece" aria-hidden="true">&#9822;</p>
      <p class="code">Erreur 404</p>
      <h1>Page introuvable</h1>
      <p class="message">
        Cette case n'existe pas sur l'échiquier&nbsp;: l'adresse est peut-être mal écrite, ou la
        page a été déplacée.
      </p>
      <a href="/">Retour à la partie</a>
    </main>
  </body>
</html>
