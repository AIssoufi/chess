# Cloudflare Pages builds and deploys the game from its Git integration. This workflow only
# publishes the page that redirects the old GitHub Pages URL to https://chess.issoufi.fr.
name: GitHub Pages redirect

on:
  push:
    branches: [master]
    paths:
      - redirect/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # GitHub Pages serves 404.html for any other path, so deep links redirect too.
      - run: cp redirect/index.html redirect/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: redirect/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # These replace the workflow's permissions: the job checks nothing out, so it needs no
    # contents: read.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
