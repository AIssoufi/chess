# Cloudflare Pages builds and deploys the game from its Git integration. This workflow only
# publishes the page that redirects the old GitHub Pages URL to https://chess.issoufi.fr.
name: GitHub Pages redirect

on:
  push:
    branches: [master]
    paths:
      - redirect/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GitHub Pages serves 404.html for any other path, so deep links redirect too.
      - run: cp redirect/index.html redirect/404.html

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: redirect/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # These replace the workflow's permissions: the job checks nothing out, so it needs no
    # contents: read.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
