name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its run; each master push gets its own group, so every
  # master commit is checked.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from the packageManager field of package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails on an advisory of high or critical severity in any dependency of the lockfile.
      - run: pnpm audit --audit-level high

      - run: pnpm format:check

      - run: pnpm lint

      # Runs the tests and fails when the coverage drops under the thresholds of vitest.config.js.
      - run: pnpm test:coverage

      - run: pnpm build

  # Reads the Playwright version of the lockfile, so the e2e job runs in the image of that exact
  # version: a bump of @playwright/test moves the image with it, and fails the job if the image
  # does not exist yet.
  playwright-version:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      version: ${{ steps.lockfile.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm-lock.yaml holds two YAML documents, the pnpm version first and the project second, so
      # yq answers once per document: keep the answer that is not null.
      - id: lockfile
        run: |
          query='.importers.".".devDependencies."@playwright/test".version | select(. != null)'
          version=$(yq "$query" pnpm-lock.yaml)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::No exact @playwright/test version in pnpm-lock.yaml: $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # The official Playwright image ships the browsers and their system libraries, so nothing comes
  # from apt, whose mirror sometimes stalls the runs.
  e2e:
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
      # Shares the host's IPC namespace, as Playwright advises, so Chromium does not run out of
      # the small default shared memory of a container.
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:e2e

  # package.json also supports Node.js 24, so the tests run on it too; audit, format, lint and
  # build stay on .nvmrc in the check job above, since their result does not depend on the
  # Node.js version.
  test-node-24:
    name: test (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
