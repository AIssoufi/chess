name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  # A newer push to a pull request cancels its run; each master push gets its own group, so every
  # master commit is checked.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads the pnpm version from the packageManager field of package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails on an advisory of high or critical severity in any dependency of the lockfile.
      - run: pnpm audit --audit-level high

      - run: pnpm format:check

      - run: pnpm lint

      - run: pnpm test

      - run: pnpm build

      # The browsers are cached per Playwright version, since each version needs its own builds;
      # their system libraries come from apt and are installed on every run.
      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d ' ' -f 2)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: pnpm exec playwright install --with-deps chromium webkit

      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: pnpm exec playwright install-deps chromium webkit

      - run: pnpm test:e2e

  # package.json also supports Node.js 26, so the tests run on it too; audit, format, lint and
  # build stay on .nvmrc in the check job above, since their result does not depend on the
  # Node.js version.
  test-node-26:
    name: test (node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
