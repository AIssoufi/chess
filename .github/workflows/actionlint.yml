# Lints the workflow files with actionlint. A workflow of its own, so that its paths filter runs it
# only on the pull requests that change a workflow.
name: Actionlint

on:
  pull_request:
    paths:
      - .github/workflows/**

permissions:
  contents: read

concurrency:
  group: actionlint-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: 1.7.12
  # SHA-256 of actionlint_1.7.12_linux_amd64.tar.gz, from the checksums file of the release.
  # Dependabot bumps no binary: update both values by hand, together.
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The official release binary, checked against the SHA-256 above before it runs.
      - name: Install actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl --fail --silent --show-error --location --output "$archive" "${url}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" actionlint
          rm "$archive"

      # Also runs shellcheck, installed on the runner, on the scripts of the run steps.
      - name: Lint the workflows
        run: ./actionlint -color
