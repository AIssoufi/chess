# Opens one weekly pull request per group. The prefixes give conventional headers, such as
# `ci(deps): Bump …` or `build(deps-dev): Bump …`, in both the commits and the titles. The commit
# check skips the signed-off commits, and the title check lets through these prefixes followed by
# `Bump` (`DEPENDABOT_TITLE` of commitlint/), despite the capitalized subject.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ['*']

  # Covers package.json and pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope
    # Majors get a pull request of their own, since they may need code changes.
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
